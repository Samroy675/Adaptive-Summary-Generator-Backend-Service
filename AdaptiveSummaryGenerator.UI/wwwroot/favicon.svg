<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f6ef7"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Document body -->
  <rect x="7" y="5" width="14" height="18" rx="2" fill="white" opacity="0.15"/>
  <rect x="7" y="5" width="13" height="17" rx="2" fill="white" opacity="0.9"/>

  <!-- Folded corner -->
  <path d="M17 5 L20 8 L17 8 Z" fill="#c4b5fd"/>

  <!-- Text lines -->
  <rect x="9.5" y="11" width="8" height="1.5" rx="0.75" fill="#4f6ef7" opacity="0.7"/>
  <rect x="9.5" y="14" width="6" height="1.5" rx="0.75" fill="#4f6ef7" opacity="0.5"/>
  <rect x="9.5" y="17" width="7" height="1.5" rx="0.75" fill="#4f6ef7" opacity="0.5"/>

  <!-- Sparkle star top-right -->
  <g transform="translate(22, 7)">
    <path d="M0,-4 L0.9,-0.9 L4,0 L0.9,0.9 L0,4 L-0.9,0.9 L-4,0 L-0.9,-0.9 Z"
          fill="#facc15" transform="scale(0.55)"/>
  </g>

  <!-- Small sparkle dot -->
  <circle cx="24.5" cy="13" r="1" fill="#facc15" opacity="0.8"/>
</svg>
